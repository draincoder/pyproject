name: labeler
on:
  pull_request:
    branches:
      - master

jobs:
  labeler:
    name: labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        if: ${{ github.event.action != 'labeled' && github.event.action != 'unlabeled' }}

      - run: echo "done adding labels"
